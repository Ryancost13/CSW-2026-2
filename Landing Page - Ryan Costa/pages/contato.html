    <h1>Faça uma Cotação</h1>
    <form action="../index.html" method="post" margin: 0 auto>
        <fieldset>
            <legend>Seus Dados</legend>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefone">Telefone / Whatsapp:</label>
            <input type="tel" id="telefone" name="telefone" required><br><br>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento"><br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade"><br><br>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado">
                <option value="">Selecione</option>
                <option value="ES">ES</option>
                <option value="MG">MG</option>
                <option value="RJ">RJ</option>
                <option value="SP">SP</option>
                <option value="Outro">Outro</option>
            </select><br><br>

            <label>Tipo de Cliente:</label><br>
            <input type="radio" id="pf" name="tipo_cliente" value="Pessoa física" required>
            <label for="pf">Pessoa Física</label>
            <input type="radio" id="pj" name="tipo_cliente" value="Pessoa jurídica" required>
            <label for="pj">Pessoa Jurídica</label><br><br>

            <label type="Cpf/Cnpj">CPF/CNPJ:</label>
            <input type="text" id="cpf_cnpj" name="cpf_cnpj" required><br><br>
        </fieldset>
        <fieldset>
            <legend>Contato</legend>
            <label for="checkbox">Como deseja ser contatado?</label><br>
            <input type="checkbox" id="checkbox" name="checkbox">Whatsapp
            <input type="checkbox" id="checkbox" name="checkbox">E-mail
            <input type="checkbox" id="checkbox" name="checkbox">Ligação
        </fieldset>
        <fieldset>
            <legend>Sobre o Projeto</legend>
            <label for="tipo">Tipo de Site:</label><br>
            <select id="tipo" name="tipo">
                <option value="">Selecione</option>
                <option value="Cartão de visita digital">Cartão de visita digital</option>
                <option value="Restaurante e cafeteria">Restaurante e cafeteria</option>
                <option value="Horários, valores e inscrições">Horários, valores e inscrições</option>
                <option value="Dinâmico">Dinâmico</option> 
                <option value="Loja virtual">Loja Virtual Simples</option>
                <option value="Avançado">Super Avançado</option>
            </select><br><br>
            <label for="quantidade">Quantidade de Páginas:</label>
            <input type="number" id="quantidade" name="quantidade" min="1" max="100"><br><br>
            <label for="checkbox">Recursos Desejados</label><br>
            <input type="checkbox" id="checkbox" name="checkbox">Formulário de Contato<br>
            <input type="checkbox" id="checkbox" name="checkbox">Galeria de Fotos<br>
            <input type="checkbox" id="checkbox" name="checkbox">Botão Whatsapp<br>
            <input type="checkbox" id="checkbox" name="checkbox">Mapa de Localização<br>
            <input type="checkbox" id="checkbox" name="checkbox">Vídeo<br>
            <input type="checkbox" id="checkbox" name="checkbox">Venda Online<br><br>

            <label for="combobox">Já Possui um Domínio?</label>
            <select id="combobox" name="combobox">
                <option value="">Selecione</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select><br><br>
            </fieldset>
        <input type="submit" value="Enviar">
    </form>
</body>
